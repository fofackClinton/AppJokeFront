<div>
  <h2>Joke List</h2>
</div >
<div ><button class="btn btn-success">Add Joke</button></div>
<table class="table">
  <thead>
    <tr>
      <th scope="col">#</th>
      <th scope="col">joke questions</th>
      <th scope="col">joke answers</th>
      <th scope="col">action</th>
    </tr>
  </thead>
  <tbody>
    @for (joke of jokesList; track $index) {
    <tr>
      <th scope="row">{{ $index + 1 }}</th>
      <td>{{ joke.jokeQuestion }}</td>
      <td>{{ joke.jokeAnswer }}</td>
      <td>
        <button class="btn btn-danger btn-sm">Delete</button>
        <button class="btn btn-primary btn-sm">Edit</button>
      </td>
    }
  </tbody>
</table>
